spring.threads.virtual.enabled=true

spring.datasource.url=${LAZARUS_DB_URL:jdbc:postgresql://localhost:5432/lazarus_db}
spring.datasource.username=${LAZARUS_DB_USER:lazarus}
spring.datasource.password=${LAZARUS_DB_PASS:lazarus_password}
spring.datasource.hikari.maximum-pool-size=${LAZARUS_DB_POOL_SIZE:10}
spring.sql.init.mode=embedded

lazarus.grpc.port=${LAZARUS_GRPC_PORT:9090}
lazarus.reaper.enabled=${LAZARUS_REAPER_ENABLED:true}
lazarus.reaper.interval-ms=${LAZARUS_REAPER_INTERVAL_MS:5000}
lazarus.reaper.batch-size=${LAZARUS_REAPER_BATCH_SIZE:100}
