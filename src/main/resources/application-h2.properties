lazarus.database.mode=h2
spring.datasource.url=${LAZARUS_DB_URL:jdbc:h2:mem:lazarus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${LAZARUS_DB_USER:sa}
spring.datasource.password=${LAZARUS_DB_PASS:}
