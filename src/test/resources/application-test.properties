spring.datasource.url=jdbc:h2:mem:lazarus_spring_it;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
lazarus.database.mode=h2

lazarus.grpc.port=0
lazarus.reaper.enabled=true
lazarus.reaper.interval-ms=25
lazarus.reaper.batch-size=100
